<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PSC - Tạo tài khoản</title>

    <link
        rel="stylesheet"
        href="create-account.css"
    >

</head>


<body>

    <div class="create-account-container">

        <div class="create-account-box">


            <div class="create-account-header">

                <div class="logo">
                    PSC
                </div>

                <div class="club-name">
                    Public Speaking Club
                </div>

            </div>


            <div class="create-account-content">


                <h1>
                    Tạo tài khoản
                </h1>


                <p class="subtitle">
                    Tạo tài khoản PSC
                </p>


                <form id="create-account-form">


                    <div class="input-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            id="username"
                            type="text"
                            placeholder="Nhập Username"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="password">
                            Mật khẩu
                        </label>

                        <input
                            id="password"
                            type="password"
                            placeholder="Nhập mật khẩu"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="confirm-password">
                            Nhập lại mật khẩu
                        </label>

                        <input
                            id="confirm-password"
                            type="password"
                            placeholder="Nhập lại mật khẩu"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <p
                        id="create-account-message"
                        class="message"
                    ></p>


                    <button
                        id="create-account-button"
                        type="submit"
                    >
                        Tạo tài khoản
                    </button>


                </form>


                <a
                    class="back-to-login"
                    href="../login.html"
                >
                    ← Quay lại đăng nhập
                </a>


            </div>

        </div>

    </div>


    <script src="create-account.js"></script>

</body>

</html>
