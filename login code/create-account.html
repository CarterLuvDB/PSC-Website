<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PSC - Tạo tài khoản</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">

    <link rel="stylesheet" href="create-account.css">
</head>

<body>

    <div class="create-account-container">

        <div class="create-account-box">

            <!-- HEADER -->
            <div class="create-account-header">

                <img
                    src="../images/logo.png"
                    alt="PSC Logo"
                >

                <div class="club-name">
                    <div class="club-main">
                        Public Speaking Club
                    </div>

                    <div class="club-sub">
                        PSC - THPT Nguyễn Hữu Cầu
                    </div>
                </div>

            </div>


            <!-- CONTENT -->
            <div class="create-account-content">

                <div class="page-title">
                    <div class="title-main">
                        Tạo tài khoản
                    </div>

                    <div class="title-sub">
                        Tạo tài khoản PSC của bạn
                    </div>
                </div>


                <form id="create-account-form">


                    <!-- USERNAME -->
                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Nhập Username"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="password">
                            Mật khẩu
                        </label>

                        <div class="password-input">

                            <input
                                type="password"
                                id="password"
                                placeholder="Nhập mật khẩu"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="password"
                                aria-label="Hiện mật khẩu"
                            >
                                <img
                                    src="../images/icon/hide.png"
                                    alt="Hiện mật khẩu"
                                >
                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">

                        <label for="confirm-password">
                            Nhập lại mật khẩu
                        </label>

                        <div class="password-input">

                            <input
                                type="password"
                                id="confirm-password"
                                placeholder="Nhập lại mật khẩu"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirm-password"
                                aria-label="Hiện mật khẩu"
                            >
                                <img
                                    src="../images/icon/hide.png"
                                    alt="Hiện mật khẩu"
                                >
                            </button>

                        </div>

                    </div>


                    <!-- FULL NAME -->
                    <div class="form-group">

                        <label for="full-name">
                            Họ và tên
                        </label>

                        <input
                            type="text"
                            id="full-name"
                            placeholder="Nhập họ và tên"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <!-- GENDER -->
                    <div class="form-group">

                        <label>
                            Giới tính
                        </label>

                        <div class="gender-options">

                            <label class="gender-option">

                                <input
                                    type="radio"
                                    name="gender"
                                    value="Nam"
                                    required
                                >

                                <span>Nam</span>

                            </label>


                            <label class="gender-option">

                                <input
                                    type="radio"
                                    name="gender"
                                    value="Nữ"
                                >

                                <span>Nữ</span>

                            </label>

                        </div>

                    </div>


                    <!-- DATE OF BIRTH -->
                    <div class="form-group">

                        <label for="date-of-birth">
                            Ngày sinh
                        </label>

                        <input
                            type="date"
                            id="date-of-birth"
                            required
                        >

                    </div>


                    <!-- MESSAGE -->
                    <div
                        id="create-account-message"
                        class="message"
                    ></div>


                    <!-- BUTTON -->
                    <button
                        type="submit"
                        class="create-account-button"
                        id="create-account-button"
                    >
                        Tạo tài khoản
                    </button>


                </form>


                <!-- NOTE -->
                <div class="account-note">
                    Một số thông tin khác có thể được bổ sung
                    trong Profile sau này.
                </div>


                <!-- BACK -->
                <div class="back-to-login">

                    <a href="../login.html">
                        ← Quay lại đăng nhập
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script src="create-account.js"></script>

</body>
</html>
