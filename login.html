<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PSC - Đăng nhập</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="login code/login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="login-header">
                <img src="images/logo.png" alt="PSC Logo">

                <div class="club-name">
                    <div class="club-main">Public Speaking Club</div>
                    <div class="club-sub">PSC - THPT Nguyễn Hữu Cầu</div>
                </div>
            </div>

            <div class="login-content">

                <div class="login-left">
                    <div class="ad-box">
                        <img src="images/banner.jpg" alt="PSC" class="ad-image active">
                        <img src="images/banner3.jpg" alt="PSC" class="ad-image">

                        <div class="ad-selector">
                            <div class="ad-tab active"></div>
                            <div class="ad-tab"></div>
                        </div>
                    </div>

                </div>

                <div class="login-right">
                    
                    <!-- I. TITLE -->
                    <div class="login-title">
                        <div class="title-text-1">Đăng nhập</div>
                        <div class="title-text-2">Chào mừng bạn đến với PSC!</div>
                    </div>

                    <!-- II. LOGIN PAD -->
                    <div class="login-pad">

                    <div class="input-zone">
                            <input type="text" placeholder="Username">
                        </div>

                        <div class="input-zone password-zone">
                            <input type="password" id="password" placeholder="Password">

                            <button type="button" class="show-password" id="show-password">
                                <img src="images/icon/view.png" alt="Hiện mật khẩu">
                            </button>
                        </div>

                        <div class="forgot-password">
                            <a href="#">Quên mật khẩu?</a>
                        </div>

                        <button class="login-button">
                            Đăng nhập
                        </button>

                    </div>

                    <!-- III. LOGIN WITH -->
                    <div class="login-with">

                        <div class="login-with-text">
                            Đăng ký vé sự kiện thay vì đăng nhập?
                        </div>

                        <button class="event-button">
                            Đăng ký vé cho sự kiện
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="login code/login.js"></script>
</body>
</html>
